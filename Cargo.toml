[package]
name = "steam2fs"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"
description = "Time-travelling read-only filesystem over Steam2 content-server blob/dat dumps (FUSE and WinFsp)"
readme = "README.md"
keywords = ["fuse", "winfsp", "steam", "archive"]
categories = ["command-line-utilities", "filesystem"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
russh = { version = "0.63", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-config = "0.58"
russh-sftp = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
aes = "0.9"
cfb-mode = "0.9"
crc32fast = "1.5"
adler2 = "2"
lru = "0.18"
parking_lot = "0.12"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
futures-util = "0.3"
hex = "0.4"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
fuser = { version = "0.18", default-features = false }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winfsp = "0.13"
widestring = "1"
# Must match the `windows` version winfsp exposes in its public API.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
] }

[dev-dependencies]
# Dev-only dependencies (tests, benchmarks) - these don't leak to production builds

[lints.rust]
# Rust compiler lints
unsafe_code = "warn"
missing_docs = "allow"  # Enable when API stabilizes

[lints.clippy]
# Clippy lint groups (lower priority so individual lints can override)
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }  # Enable selectively as needed
nursery = { level = "allow", priority = -1 }   # Enable selectively as needed

# Individual clippy lints worth enabling
enum_glob_use = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
ptr_as_ptr = "warn"
redundant_closure_for_method_calls = "warn"
unwrap_used = "warn"  # Warn in production code; allow per-module in tests/examples

[profile.dev]
# Fast compile times for development
opt-level = 0
debug = true

[profile.release]
# Optimize for binary size and performance
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.test]
# Keep some debug info for test failures
opt-level = 0
debug = true
